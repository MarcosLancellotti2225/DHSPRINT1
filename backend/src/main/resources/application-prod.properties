# Perfil de produccion: PostgreSQL.
# Se activa con:  mvn spring-boot:run -Dspring-boot.run.profiles=prod
# o bien:         java -jar target/nexthome-0.1.0.jar --spring.profiles.active=prod

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexthome}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# Las imagenes se guardan fuera del proyecto para sobrevivir a los redeploys.
app.uploads.dir=${UPLOADS_DIR:/var/lib/nexthome/uploads}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5174}
