spring.application.name=nexthome
server.port=8080

# --- Base de datos (desarrollo): H2 en memoria ---------------------------------
# El perfil "prod" (application-prod.properties) reemplaza estas propiedades por
# PostgreSQL sin tocar una sola linea de codigo Java.
spring.datasource.url=jdbc:h2:mem:nexthome;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Carga de imagenes ---------------------------------------------------------
app.uploads.dir=uploads
app.uploads.public-path=/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# --- Autenticacion -------------------------------------------------------------
# La clave de firma de los JWT debe tener al menos 32 caracteres (HS256). En
# produccion se pisa con la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-de-nexthome-cambiar-en-produccion}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Administrador que se precarga al arrancar si todavia no existe.
app.admin.email=${ADMIN_EMAIL:admin@nexthome.com}
app.admin.password=${ADMIN_PASSWORD:Admin1234}

# --- CORS ----------------------------------------------------------------------
# 5173 es el puerto por defecto de Vite; se incluyen los dos siguientes porque Vite
# los usa automaticamente si el 5173 esta ocupado.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175
