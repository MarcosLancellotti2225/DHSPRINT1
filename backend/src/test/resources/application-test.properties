# Base y carpeta de imagenes propias de los tests, para no pisar las de desarrollo.
spring.datasource.url=jdbc:h2:mem:nexthome-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

app.uploads.dir=target/test-uploads
app.uploads.public-path=/uploads
app.cors.allowed-origins=http://localhost:5174

spring.h2.console.enabled=false
